<svg width="1024" height="300"
     viewBox="0 0 1024 300"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
            refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>

    <style>
      text {
        font-family: "Helvetica, Arial, sans-serif";
        fill: #000;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1024" height="300" fill="white"/>

  <!-- Common parameters -->
  <!-- Big circles centers along x: 110, 310, 510, 710, 910; y=150 -->
  <!-- Radius ~85 -->

  <!-- Intra-disciplinary -->
  <circle cx="110" cy="150" r="85" fill="white" stroke="black" stroke-width="3"/>
  <circle cx="110" cy="150" r="10" fill="white" stroke="black" stroke-width="2"/>

  <text x="110" y="24" text-anchor="middle" font-size="30">Intra-</text>
  <text x="110" y="52" text-anchor="middle" font-size="30">disciplinary</text>

  <!-- Cross-disciplinary -->
  <circle cx="310" cy="150" r="85" fill="white" stroke="black" stroke-width="3"/>

  <!-- scattered small circles -->
  <circle cx="280" cy="120" r="8" fill="white" stroke="black" stroke-width="1.5"/>
  <circle cx="305" cy="105" r="8" fill="white" stroke="black" stroke-width="1.5"/>
  <circle cx="335" cy="120" r="8" fill="white" stroke="black" stroke-width="1.5"/>
  <circle cx="275" cy="155" r="8" fill="white" stroke="black" stroke-width="1.5"/>
  <circle cx="310" cy="160" r="8" fill="white" stroke="black" stroke-width="1.5"/>
  <circle cx="340" cy="150" r="8" fill="white" stroke="black" stroke-width="1.5"/>
  <circle cx="300" cy="185" r="8" fill="white" stroke="black" stroke-width="1.5"/>

  <text x="310" y="24" text-anchor="middle" font-size="30">Cross-</text>
  <text x="310" y="52" text-anchor="middle" font-size="30">disciplinary</text>

  <!-- Multi-disciplinary -->
  <circle cx="510" cy="150" r="85" fill="white" stroke="black" stroke-width="3"/>

  <!-- six small circles on a ring (R=93) around (510,150): bottom circle top at y=235 matches big-circle bottom -->
  <circle cx="510" cy="243" r="8" fill="white" stroke="black" stroke-width="1.5"/>
  <circle cx="590.5" cy="196.5" r="8" fill="white" stroke="black" stroke-width="1.5"/>
  <circle cx="590.5" cy="103.5" r="8" fill="white" stroke="black" stroke-width="1.5"/>
  <circle cx="510" cy="57" r="8" fill="white" stroke="black" stroke-width="1.5"/>
  <circle cx="429.5" cy="103.5" r="8" fill="white" stroke="black" stroke-width="1.5"/>
  <circle cx="429.5" cy="196.5" r="8" fill="white" stroke="black" stroke-width="1.5"/>

  <text x="510" y="24" text-anchor="middle" font-size="30">Multi-</text>
  <text x="510" y="52" text-anchor="middle" font-size="30">disciplinary</text>

  <!-- Inter-disciplinary -->
  <circle cx="710" cy="150" r="85" fill="white" stroke="black" stroke-width="3"/>

  <!-- small tighter cluster -->
  <circle cx="700" cy="145" r="8" fill="white" stroke="black" stroke-width="1.5"/>
  <circle cx="715" cy="135" r="8" fill="white" stroke="black" stroke-width="1.5"/>
  <circle cx="725" cy="150" r="8" fill="white" stroke="black" stroke-width="1.5"/>
  <circle cx="710" cy="160" r="8" fill="white" stroke="black" stroke-width="1.5"/>
  <circle cx="695" cy="155" r="8" fill="white" stroke="black" stroke-width="1.5"/>

  <text x="710" y="24" text-anchor="middle" font-size="30">Inter-</text>
  <text x="710" y="52" text-anchor="middle" font-size="30">disciplinary</text>

  <!-- Trans-disciplinary -->
  <circle cx="910" cy="150" r="85" fill="white" stroke="black" stroke-width="3"/>

  <!-- two overlapping circles -->
  <circle cx="905" cy="145" r="10" fill="white" stroke="black" stroke-width="1.5"/>
  <circle cx="915" cy="150" r="10" fill="white" stroke="black" stroke-width="1.5"/>

  <text x="910" y="24" text-anchor="middle" font-size="30">Trans-</text>
  <text x="910" y="52" text-anchor="middle" font-size="30">disciplinary</text>

  <!-- Dotted path with arrow pointing at intra-disciplinary (left) -->
  <path d="
      M 910 238
      L 910 262
      L 110 262
      L 110 238"
        fill="none"
        stroke="black"
        stroke-width="4"
        stroke-dasharray="4,6"
        marker-end="url(#arrowhead)"/>

</svg>
