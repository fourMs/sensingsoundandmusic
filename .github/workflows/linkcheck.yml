name: Link Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check

      - name: Run markdown link check
        run: |
          # Check all Markdown files in the repo (skip generated/build folders and
          # vendored apps, whose upstream READMEs reference files we do not vendor)
          find . -name '*.md' -not -path './.git/*' -not -path './book/_build/*' -not -path './node_modules/*' -not -path './book/apps/videoviz/*' -print0 \
            | xargs -0 -I{} markdown-link-check -q {}
