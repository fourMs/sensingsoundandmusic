# Builds the Myst site and publishes to the gh-pages branch (classic Pages flow).
# Repo Settings → Pages: set source to branch gh-pages, folder / (root).
name: Deploy Jupyter Book

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The decks are an experimental extra, so they build in their own job and are
  # never allowed to hold up the book. Installing TeX pulls ~73 MB from the
  # Ubuntu mirrors, which on a bad runner has taken half an hour; when that
  # happens this job gives up and the site still deploys, just without
  # /slides/. Restore-keys mean a good download is reused on later runs.
  slides:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      TEX_PKGS: texlive-latex-base texlive-latex-recommended texlive-pictures lmodern latexmk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Cache the TeX packages
        id: tex-cache
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives/*.deb
          key: tex-debs-${{ runner.os }}-v1

      - name: Install LaTeX
        run: |
          sudo apt-get update
          # Keep the .deb files so the cache above can reuse them next time.
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          sudo apt-get install -y --no-install-recommends $TEX_PKGS

      - name: Build the decks
        run: make -C beamer all

      - name: Upload the decks
        uses: actions/upload-artifact@v4
        with:
          name: lecture-decks
          path: beamer/week*.pdf
          if-no-files-found: error
          retention-days: 7

  build-deploy:
    runs-on: ubuntu-latest
    # Run even when the decks failed or timed out; the book comes first.
    # `!cancelled()` rather than `always()` so a superseded run still stops.
    needs: [slides]
    if: ${{ !cancelled() }}
    # A hung Jupyter kernel otherwise burns the full 6-hour job allowance and
    # surfaces as a "cancelled" run. Fail fast instead, so the retry can act.
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "jupyter-book>=2.0.0a0"
          # mystmd is pinned in requirements.txt (keep the two in sync).
          pip install -r requirements.txt

      # The decks ride along with the site rather than publishing themselves:
      # the publish step below uses force_orphan, which replaces the whole
      # gh-pages branch, so anything published separately would be wiped by the
      # next book deploy. A missing artifact is not an error, it just means the
      # site goes out without /slides/ this time.
      - name: Download the lecture decks
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: lecture-decks
          path: beamer

      - name: Build Jupyter Book HTML
        run: |
          cd book
          # Execution can intermittently crash OR hang the Jupyter kernel on CI
          # (memory pressure on heavy notebooks). Bound each attempt with
          # `timeout` so a hang is killed and the retry can run; myst reuses the
          # execution cache, so only the notebook that failed is re-executed.
          # The 30-min job timeout is the final backstop.
          timeout 12m env BASE_URL=/sensingsoundandmusic myst build --html --execute \
            || timeout 12m env BASE_URL=/sensingsoundandmusic myst build --html --execute
          # Myst fingerprints _static assets under /build/, which breaks stable URLs.
          # Copy the beating demo to a stable top-level path for linking from content.
          cp "_static/beating-demo.html" "_build/html/beating-demo.html"
          # Copy the bundled web apps to a stable top-level path (/apps/...).
          cp -r "apps" "_build/html/apps"
          # Publish the lecture decks at a stable path (/slides/weekNN-*.pdf),
          # if the slides job managed to produce them.
          if compgen -G "../beamer/week*.pdf" > /dev/null; then
            mkdir -p "_build/html/slides"
            cp ../beamer/week*.pdf "_build/html/slides/"
            echo "Published $(ls ../beamer/week*.pdf | wc -l) lecture deck(s)."
          else
            echo "No lecture decks to publish; the slides job did not produce any."
          fi

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book/_build/html
          force_orphan: true
