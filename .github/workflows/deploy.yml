# Builds the Myst site and publishes to the gh-pages branch (classic Pages flow).
# Repo Settings → Pages: set source to branch gh-pages, folder / (root).
name: Deploy Jupyter Book

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The Beamer decks in beamer/ are deliberately not built here. They are an
  # experiment, they need a ~73 MB TeX install that has taken half an hour on a
  # bad Ubuntu mirror, and they are not linked from the book. Build them by hand
  # when you need them: `make -C beamer all`.
  build-deploy:
    runs-on: ubuntu-latest
    # A hung Jupyter kernel otherwise burns the full 6-hour job allowance and
    # surfaces as a "cancelled" run. Fail fast instead, so the retry can act.
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "jupyter-book>=2.0.0a0"
          # mystmd is pinned in requirements.txt (keep the two in sync).
          pip install -r requirements.txt

      - name: Build Jupyter Book HTML
        run: |
          cd book
          # Execution can intermittently crash OR hang the Jupyter kernel on CI
          # (memory pressure on heavy notebooks). Bound each attempt with
          # `timeout` so a hang is killed and the retry can run.
          # Limit BLAS/OpenMP thread fan-out to reduce memory pressure and
          # stabilize notebook kernels on shared CI runners.
          ok=0
          for attempt in 1 2 3; do
            echo "MyST build attempt ${attempt}/3"
            if timeout 10m env \
              BASE_URL=/sensingsoundandmusic \
              OMP_NUM_THREADS=1 \
              OPENBLAS_NUM_THREADS=1 \
              MKL_NUM_THREADS=1 \
              NUMEXPR_NUM_THREADS=1 \
              myst build --html --execute; then
              ok=1
              break
            fi
            echo "Attempt ${attempt} failed; retrying..."
          done
          [ "$ok" -eq 1 ]
          # Myst fingerprints _static assets under /build/, which breaks stable URLs.
          # Copy the beating demo to a stable top-level path for linking from content.
          cp "_static/beating-demo.html" "_build/html/beating-demo.html"
          # Copy the bundled web apps to a stable top-level path (/apps/...).
          cp -r "apps" "_build/html/apps"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book/_build/html
          force_orphan: true
