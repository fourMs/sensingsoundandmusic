name: Deploy Jupyter Book

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "jupyter-book>=2.0.0a0"
          # Myst 1.8.x currently rejects the upstream plain_latex template metadata.
          # Pinning 1.6.0 keeps PDF export stable in CI.
          pip install "mystmd==1.6.0"
          pip install ghp-import
          pip install -r requirements.txt

      - name: Install TeX Live for LaTeX PDF export
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-extra \
            texlive-fonts-extra \
            texlive-fonts-recommended \
            texlive-science \
            texlive-xetex \
            latexmk \
            lmodern \
            imagemagick

      - name: Build Jupyter Book HTML
        run: |
          cd book
          BASE_URL=/sensingsoundandmusic myst build --html --execute

      - name: Build PDF exports
        run: |
          cd book
          myst build --pdf || true

      - name: Copy PDFs into HTML output for web serving
        run: |
          mkdir -p book/_build/html
          find book/_build/exports -name '*.pdf' \
               -exec cp {} book/_build/html/ \; \
               2>/dev/null || true
          find book -maxdepth 1 -name '*.pdf' \
               -exec cp {} book/_build/html/ \; \
               2>/dev/null || true

      - name: Upload PDF as release artifact
        uses: actions/upload-artifact@v4
        with:
          name: textbook-pdf
          path: book/_build/html/*.pdf
          if-no-files-found: warn

      - name: Deploy to GitHub Pages
        run: |
          ghp-import -n -p -f book/_build/html
