# Builds the Myst site and publishes to the gh-pages branch (classic Pages flow).
# Repo Settings → Pages: set source to branch gh-pages, folder / (root).
name: Deploy Jupyter Book

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "jupyter-book>=2.0.0a0"
          pip install "mystmd==1.6.0"
          pip install -r requirements.txt

      - name: Build Jupyter Book HTML
        run: |
          cd book
          # Execution can intermittently crash the Jupyter kernel on CI (memory
          # pressure on heavy notebooks). Retry once; myst reuses the execution
          # cache, so only the notebook that failed is re-executed.
          BASE_URL=/sensingsoundandmusic myst build --html --execute \
            || BASE_URL=/sensingsoundandmusic myst build --html --execute
          # Myst fingerprints _static assets under /build/, which breaks stable URLs.
          # Copy the beating demo to a stable top-level path for linking from content.
          cp "_static/beating-demo.html" "_build/html/beating-demo.html"
          # Copy the bundled web apps to a stable top-level path (/apps/...).
          cp -r "apps" "_build/html/apps"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book/_build/html
          force_orphan: true
