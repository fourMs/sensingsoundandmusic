name: Deploy Jupyter Book

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "jupyter-book>=2.0.0a0"
          # Myst 1.8.x currently rejects the upstream plain_latex template metadata.
          # Pinning 1.6.0 keeps PDF export stable in CI.
          pip install "mystmd==1.6.0"
          pip install -r requirements.txt

      - name: Install TeX Live for LaTeX PDF export
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-extra \
            texlive-fonts-extra \
            texlive-fonts-recommended \
            texlive-science \
            texlive-xetex \
            latexmk \
            lmodern \
            imagemagick

      - name: Build Jupyter Book HTML
        run: |
          cd book
          BASE_URL=/sensingsoundandmusic myst build --html --execute

      - name: Build PDF exports
        run: |
          cd book
          myst build --pdf || true

      - name: Copy PDFs into HTML output for web serving
        run: |
          mkdir -p book/_build/html
          find book/_build/exports -name '*.pdf' \
               -exec cp {} book/_build/html/ \; \
               2>/dev/null || true
          # Also copy hashed PDFs produced under site/public (Myst may only emit hashed names there).
          find book/_build/site/public -maxdepth 1 -name '*.pdf' \
               -exec cp {} book/_build/html/ \; \
               2>/dev/null || true

          # Canonicalize chapter PDF filenames expected by page download links.
          for name in index tuning-in listening acoustics psychoacoustics electroacoustics time-and-rhythm harmony-and-melody the-body the-brain vision physiology machine-listening general-comments; do
            if [ ! -f "book/_build/html/${name}.pdf" ]; then
              candidate=$(ls -1 book/_build/site/public/${name}-*.pdf 2>/dev/null | head -n 1 || true)
              if [ -n "$candidate" ]; then
                cp "$candidate" "book/_build/html/${name}.pdf"
              fi
            fi
          done

          # Fallback: front page expects sensing-sound-and-music.pdf.
          # If the combined project PDF failed but index.pdf exists, publish index.pdf under that name.
          if [ ! -f book/_build/html/sensing-sound-and-music.pdf ] && [ -f book/_build/html/index.pdf ]; then
            cp book/_build/html/index.pdf book/_build/html/sensing-sound-and-music.pdf
          fi
          find book -maxdepth 1 -name '*.pdf' \
               -exec cp {} book/_build/html/ \; \
               2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/_build/html

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
