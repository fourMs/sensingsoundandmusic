name: Deploy Jupyter Book

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "jupyter-book>=2.0.0a0"
          pip install ghp-import
          pip install -r requirements.txt

      - name: Install TeX Live for LaTeX PDF export
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-extra \
            texlive-fonts-extra \
            texlive-fonts-recommended \
            texlive-science \
            texlive-xetex \
            latexmk \
            lmodern

      - name: Build Jupyter Book HTML
        run: |
          cd book
          BASE_URL=/sensingsoundandmusic myst build --html

      - name: Build PDF exports
        run: |
          cd book
          myst build --pdf || true

      - name: Copy PDF into HTML output for web serving
        run: |
          mkdir -p book/_build/html
          find book/_build/exports -name '*.pdf' \
               -exec cp {} book/_build/html/sensing-sound-and-music.pdf \; \
               2>/dev/null || true

      - name: Upload PDF as release artifact
        uses: actions/upload-artifact@v4
        with:
          name: textbook-pdf
          path: book/_build/exports/*.pdf
          if-no-files-found: warn

      - name: Deploy to GitHub Pages
        run: |
          ghp-import -n -p -f book/_build/html
